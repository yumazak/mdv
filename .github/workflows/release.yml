name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          go build -trimpath -buildvcs=false -ldflags "-s -w" -o dist/mdv .
          cp -R vendor dist/vendor
          tar -C dist -czf "mdv-${version}-${GOOS}-${GOARCH}.tar.gz" mdv vendor

      - name: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "mdv-*.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: mdv-${{ matrix.goos }}-${{ matrix.goarch }}
          path: mdv-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: checksums
        run: |
          cd artifacts
          shasum -a 256 *.tar.gz > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt
          generate_release_notes: true
